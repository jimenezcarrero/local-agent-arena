version = 1

; Jetson Orin Nano 8GB — arena-validated model presets
; Campaign: github.com/jimenezcarrero/jetson-llm-benchmarks
; Served by the NO_VMM build (~/Repositories/llama.cpp/build-novmm) which is
; required for Ling (bailingmoe3) and avoids the Tegra cuMemCreate bug.
;
; -ub 128 keeps the prompt-processing compute buffer small; on this board that
; buffer is often the allocation that OOMs.

[*]
ngl     = 99
fa      = on
np      = 1
ub      = 128
b       = 512
jinja   = true
metrics = true

; ── CHAMPION — undefeated across all 4 arenas, both windows.
;    Marathon 11/11 in 18m45s; crusher@32K peak only 9.2K ctx.
[ornith]
model = /home/JetsonOrin/Repositories/llama.cpp/models/Ornith-1.0-9B-MTP-IQ3_M.gguf
c     = 65536
ctk   = q4_0
ctv   = q4_0

; ── ORNITH 1.5 — faster one-shot than the champion, weaker in sessions.
;    IQ3_M (4.42 GB) is the reliable footprint with a desktop session up.
[ornith15]
model = /home/JetsonOrin/Repositories/llama.cpp/models/Ornith-1.5-9B-IQ3_M.gguf
c     = 65536
ctk   = q4_0
ctv   = q4_0

; ── Ornith-1.5 IQ4_XS — measurably faster (12.4 vs 10.4 t/s) but 4.9 GB:
;    needs a nearly idle board (no Claude/browser). Use `llm load` after a
;    fresh boot, or expect "failed to load".
[ornith15-fast]
model = /home/JetsonOrin/Repositories/llama.cpp/models/Ornith-1.5-9B-IQ4_XS.gguf
c     = 32768
ctk   = q4_0
ctv   = q4_0

; ── Ornith-1.5 with the biggest window that fits
[ornith15-98k]
model = /home/JetsonOrin/Repositories/llama.cpp/models/Ornith-1.5-9B-IQ3_M.gguf
c     = 98304
ctk   = q4_0
ctv   = q4_0

; ── EFFICIENCY / SPEED KING — 34 tok/s, best energy per task in the campaign.
;    NEEDS a big window: it deadlocks at 32K. temp 0.3 beats the card's 1.0.
[ling]
model         = /home/JetsonOrin/Repositories/llama.cpp/models/Ling-3.0-tiny-Q4_K_M.gguf
c             = 131072
ctk           = q4_0
ctv           = q4_0
temp          = 0.3
top-p         = 0.95
top-k         = 20

; ── SPEED PICK 4B — fastest perfect marathon (15m47s). Avoid small windows.
[a1-131k]
model = /home/JetsonOrin/Repositories/llama.cpp/models/Agents-A1-4B-Q4_K_M.gguf
c     = 131072
ctk   = q4_0
ctv   = q4_0

; ── MAX CONTEXT — only full 262K native window that fits this board
[a1-262k]
model = /home/JetsonOrin/Repositories/llama.cpp/models/Agents-A1-4B-Q4_K_M.gguf
c     = 262144
ctk   = q4_0
ctv   = q4_0

